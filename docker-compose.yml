services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repo-reader-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Chat clients are unauthenticated; local paths would let them read
      # container-local directories. Override in .env for local dev only.
      - ALLOW_LOCAL_REPO_TARGETS=false
    # No ports exposed here! The backend is completely hidden from the internet.
    # It is only accessible to the frontend container on the internal Docker network.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Connect to the backend through the Nginx reverse proxy using the /api route
        - VITE_API_BASE_URL=/api
        - VITE_FAVICON_URL=/githubs.svg
    container_name: repo-reader-frontend
    restart: unless-stopped
    # ports:
    #   # Expose Nginx to the internet on port 80
    #   - "80:80"
    depends_on:
      - backend
